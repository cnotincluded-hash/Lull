<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Lull mini player</title>
<style>
@font-face{font-family:'Onest';font-weight:400;src:url(fonts/onest-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Onest';font-weight:500;src:url(fonts/onest-latin-500-normal.woff2) format('woff2')}
:root{--bg:#1C1D22;--ink:#ECECEF;--muted:#A0A2AC;--accent:#7DBDC3;--hover:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,sans-serif;overflow:hidden;user-select:none}
.wrap{height:100%;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;-webkit-app-region:drag}
button{-webkit-app-region:no-drag;border:0;background:none;color:var(--ink);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;cursor:default}
button:hover{background:var(--hover)}
button.main{background:var(--accent);color:#10282A}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="meta"><b id="t">Nothing playing</b><small id="s"></small></div>
  <button id="toggle" class="main" aria-label="Play or pause"></button>
  <button id="mute" aria-label="Mute"></button>
  <button id="back" aria-label="Go to the tab" title="Go to the tab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M17 13.5V19H5V7h5.5"/></svg></button>
  <button id="close" aria-label="Close mini player" title="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
</div>
<script>
const svg = (d, fill) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const P = { play: 'M8 5.5v13l10-6.5z', pause: 'M8 5.5v13M16 5.5v13', speaker: 'M5 9.5h3l4-3.5v12l-4-3.5H5zM15.5 9a4 4 0 0 1 0 6', muted: 'M5 9.5h3l4-3.5v12l-4-3.5H5zM16 9.5l5 5M21 9.5l-5 5' };
document.getElementById('toggle').onclick = () => window.mini.act('toggle');
document.getElementById('mute').onclick = () => window.mini.act('mute');
document.getElementById('back').onclick = () => window.mini.act('back');
document.getElementById('close').onclick = () => window.mini.act('close');
window.mini.on((s) => {
  document.getElementById('t').textContent = s.title || 'Playing';
  document.getElementById('s').textContent = s.site || '';
  const tg = document.getElementById('toggle');
  tg.innerHTML = svg(s.playing ? P.pause : P.play, !s.playing);
  tg.setAttribute('aria-label', s.playing ? 'Pause' : 'Play');
  const m = document.getElementById('mute');
  m.innerHTML = svg(s.muted ? P.muted : P.speaker);
  m.setAttribute('aria-label', s.muted ? 'Unmute' : 'Mute');
});
</script>
</body>
</html>
