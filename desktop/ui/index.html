<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Lull</title>
<style>
@font-face{font-family:'Onest';font-weight:400;src:url(fonts/onest-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Onest';font-weight:500;src:url(fonts/onest-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Onest';font-weight:600;src:url(fonts/onest-latin-600-normal.woff2) format('woff2')}
:root{
  /* Layout: sidebar on the left (pinned, minimised to a rail, or hidden until you point at the edge); pages live in native views to the right */
  --bg:#F3F3F1; --surface:#FFFFFF; --ink:#1B1C20; --muted:#686A73; --line:rgba(24,26,34,.10); --hover:rgba(24,26,34,.06);
  --shadow:0 10px 36px rgba(20,22,30,.16); --ui:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --accent:#3D7A80; --tint:#E3EBEB; --sbw:280px; --dock:280px; color-scheme:light;
}
html.dark{--bg:#121316; --surface:#1C1D22; --ink:#ECECEF; --muted:#A0A2AC; --line:rgba(255,255,255,.10); --hover:rgba(255,255,255,.07); --shadow:0 10px 36px rgba(0,0,0,.55); color-scheme:dark}
html.priv{--bg:#17141F; --surface:#241F31; --ink:#EDEBF3; --muted:#AAA4BB; --line:rgba(255,255,255,.10); --hover:rgba(255,255,255,.07); --shadow:0 10px 36px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:transparent;overflow:hidden}
body{font-family:var(--ui);font-size:14px;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;cursor:default}
button:disabled{opacity:.35}
input{font:inherit;color:inherit;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:block;flex:none}
.muted{color:var(--muted)}
.drag{-webkit-app-region:drag}
.drag button,.drag input{-webkit-app-region:no-drag}
.ib{border:0;background:none;border-radius:9px;width:32px;height:32px;display:grid;place-items:center;padding:0;color:var(--ink);flex:none;position:relative}
.ib:hover{background:var(--hover)}
.ib.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 14px;font-weight:500;color:var(--ink)}
.btn:hover{background:color-mix(in srgb,var(--surface) 88%,var(--ink))}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.danger{color:#C2413A}
.fav{display:grid;place-items:center;color:#fff;font-weight:600;flex:none;line-height:1;overflow:hidden}
.fav img{width:100%;height:100%;object-fit:contain;display:block}
.fav.img{background:#fff;border:1px solid var(--line)}
.fav-lull{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}

/* ---------- sidebar ---------- */
#app{position:absolute;inset:0}
#sb{position:absolute;left:0;top:0;bottom:0;width:var(--sbw);display:none;flex-direction:column;gap:10px;padding:10px 8px 10px 10px;background:var(--tint)}
.m-pinned #sb{display:flex}
.peek #sb{display:flex;left:8px;top:8px;bottom:8px;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:10px;z-index:30;animation:slide .16s ease-out}
@keyframes slide{from{transform:translateX(-14px);opacity:.4}}
.sb-top{display:flex;align-items:center;gap:2px;min-height:34px}
.mac .sb-top{padding-left:70px}
.sb-top .sp{flex:1;align-self:stretch}
.addr{display:flex;align-items:center;gap:2px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:0 4px}
.addr .txt{flex:1;min-width:0;border:0;background:none;height:100%;text-align:left;padding:0 6px;display:flex;align-items:center;gap:6px;cursor:text}
.addr .txt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr .txt.ph{color:var(--muted)}
.addr .shield{color:var(--accent)}
.addr .shield.off{color:var(--muted)}
.badge{position:absolute;top:-1px;right:-3px;min-width:16px;height:16px;border-radius:8px;padding:0 4px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
.zoomb{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:2px 6px;background:none;color:var(--muted)}
.prog{height:2px;border-radius:1px;background:var(--accent);margin:-8px 8px 0;opacity:0;transition:opacity .3s}
.prog.on{opacity:1;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.favs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.favs .tile{height:44px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 65%,transparent);display:grid;place-items:center;padding:0}
.favs .tile:hover{background:var(--surface)}
.favs .tile.on{background:var(--surface);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.favs.drop{outline:2px dashed var(--accent);outline-offset:3px;border-radius:12px}
.newtab{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 8px;border-radius:10px;color:var(--muted);text-align:left}
.newtab:hover{background:var(--hover);color:var(--ink)}
.tabs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-top:-6px}
.trow{display:flex;align-items:center;border-radius:11px;position:relative}
.trow:hover{background:var(--hover)}
.trow.on{background:var(--surface);box-shadow:0 1px 6px rgba(20,22,30,.08)}
.trow.drag-over{box-shadow:inset 0 2px 0 var(--accent)}
.trow-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 6px 7px 8px;text-align:left}
.trow-main span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .x{opacity:0;width:26px;height:26px;margin-right:4px;color:var(--muted)}
.trow:hover .x,.trow.on .x{opacity:1}
.trow .aud{width:24px;height:24px;color:var(--accent)}
.now{border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:8px 8px 8px 10px;display:flex;align-items:center;gap:8px}
.now .meta{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column}
.now .meta b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .meta small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;color:var(--accent);margin-right:4px}
.now .eq i{width:2.5px;background:currentColor;border-radius:1px;animation:eq .9s infinite ease-in-out}
.now .eq i:nth-child(2){animation-delay:-.3s}.now .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
.sb-foot{display:flex;align-items:center;gap:2px}
.sb-foot .sp{flex:1}
.space{height:32px;min-width:34px;border-radius:10px;border:1px solid transparent;background:none;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;color:var(--muted);font-size:13px}
.space:hover{background:var(--hover)}
.space.on{background:var(--surface);border-color:var(--line);color:var(--c)}
.space.on span{color:var(--ink)}
.space:not(.on) span{display:none}
.resize{position:absolute;top:0;bottom:0;right:-3px;width:8px;cursor:col-resize;z-index:5}
.m-pinned.peek .resize,.peek .resize{display:none}

/* rail (minimised sidebar) */
#rail{position:absolute;left:0;top:0;bottom:0;width:72px;display:none;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:var(--tint)}
.m-rail #rail{display:flex}
.mac #rail{padding-top:42px}
#rail .rt{width:44px;height:40px;border-radius:12px;border:1px solid transparent;background:none;display:grid;place-items:center;position:relative;padding:0}
#rail .rt:hover{background:var(--hover)}
#rail .rt.on{background:var(--surface);border-color:var(--line)}
#rail .dot{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--tint)}
#rail .sep{width:28px;height:1px;background:var(--line);margin:2px 0}
#rail .list{display:flex;flex-direction:column;align-items:center;gap:4px;overflow-y:auto;min-height:0;flex:0 1 auto}
#rail .sp{flex:1}
#edge{position:absolute;left:0;top:0;bottom:0;width:6px;display:none}
.m-hidden #edge{display:block}

/* content area (Lull's own pages) */
#content{position:absolute;top:8px;right:8px;bottom:8px;left:var(--dock);border-radius:10px;background:var(--bg);overflow-y:auto;display:none;box-shadow:0 1px 10px rgba(20,22,30,.08)}
.nodock #content{inset:0;border-radius:0;box-shadow:none}
.screen #content{display:block}

/* overlays */
#scrim{position:absolute;inset:0;z-index:40;display:none}
#scrim.on{display:block}
#scrim.dim{background:rgba(10,11,14,.38)}
.pop{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;width:330px;max-height:calc(100% - 24px);overflow-y:auto;display:none}
.pop.on{display:block;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.pop h3,.modal h3{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;margin:2px 0 10px;min-width:0}
.pop h3 span,.modal h3 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.big{font-size:32px;font-weight:600;margin:0;color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:13.5px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row b{font-weight:500}
.row small{color:var(--muted);font-size:12.5px;line-height:1.4}
.sw{width:40px;height:24px;border-radius:12px;border:0;background:color-mix(in srgb,var(--ink) 20%,transparent);position:relative;flex:none;padding:0;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(16px)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile2{border:1px solid var(--line);background:none;border-radius:15px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;text-align:center}
.tile2:hover{background:var(--hover)}
.tile2 .ic{color:var(--accent)}
.tile2 small{font-size:11px;color:var(--muted)}
.tile2.on{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.zrow{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--hover)}
.zrow span{flex:1}
.stop{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;background:var(--hover);font-size:13px;margin-top:4px}
.stop span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menuitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left}
.menuitem:hover{background:var(--hover)}

#cmd{position:absolute;z-index:50;left:50%;top:12vh;transform:translateX(-50%);width:min(660px,calc(100% - 40px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:none;overflow:hidden}
#cmd.on{display:block;animation:pop .14s ease-out}
.cmd-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:56px;border-bottom:1px solid var(--line)}
.cmd-in input{flex:1;border:0;outline:none;background:none;font-size:17px}
.cmd-list{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.sg{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 10px;border-radius:11px;text-align:left}
.sg.sel,.sg:hover{background:var(--hover)}
.sg span{min-width:0;display:flex;flex-direction:column;flex:1}
.sg b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.sg-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 10px 4px}

.modal{position:absolute;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 40px));max-height:calc(100% - 60px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px 22px;display:none}
.modal.on{display:block;animation:pop .14s ease-out}
.modal.wide{width:min(760px,calc(100% - 40px))}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mhead h3{margin:0}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 11px;font-size:14.5px;outline:none}
.field:focus{border-color:var(--accent)}
.flabel{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 2px;text-align:left}
.opt i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.on i{border:6px solid var(--accent)}
.seg{display:flex;background:var(--hover);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:6px 8px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.lim{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:7px}
.lim-top{display:flex;align-items:center;gap:10px}
.lim-top b{font-weight:500;flex:1}
.lim-bar{height:5px;border-radius:3px;background:var(--hover);overflow:hidden}
.lim-bar i{display:block;height:100%;background:var(--accent)}
.help-sec{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.help-sec h4{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:15.5px;font-weight:600}
.help-sec h4 .n{width:24px;height:24px;border-radius:8px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);display:grid;place-items:center;font-size:12.5px;flex:none}
.help-sec p,.help-sec li{font-size:14px;line-height:1.55;margin:0 0 6px;user-select:text}
.help-sec ol,.help-sec ul{margin:0;padding-left:20px}
.help-sec .ic{display:inline-block;vertical-align:-3px;color:var(--accent)}
.kbd{display:inline-block;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--bg);white-space:nowrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}

#glance{position:absolute;z-index:45;left:50%;top:40px;bottom:40px;transform:translateX(-50%);width:min(980px,calc(100% - 80px));display:none;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.4);border:1px solid var(--line)}
#glance.on{display:flex}
.gl-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;height:54px;flex:none}
.gl-head .t{flex:1;min-width:0;display:flex;flex-direction:column}
.gl-head b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-head small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-body{flex:1;margin:0 6px 6px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--muted)}

#stack{position:absolute;z-index:35;left:12px;bottom:12px;width:316px;display:flex;flex-direction:column;gap:8px}
.m-pinned:not(.peek) #stack{width:calc(var(--sbw) - 22px);bottom:58px}
.toast{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:9px 8px 9px 12px;display:flex;align-items:center;gap:8px;animation:pop .14s ease-out}
.toast .tt{flex:1;min-width:0;font-size:13px;line-height:1.35}
.toast .tt b{font-weight:600;display:block}
.toast .tt small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast>.ic{color:var(--accent)}
.findbar{background:var(--surface);border:1px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:4px 4px 4px 10px;display:flex;align-items:center;gap:4px}
.findbar input{flex:1;min-width:0;border:0;outline:none;background:none;height:32px}
.findbar .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* new tab page and paused page */
.start{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:11vh 24px 24px;text-align:center}
.clock{font-size:76px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.date{color:var(--muted);margin:10px 0 28px;font-size:15px}
.search{width:100%;max-width:560px;height:54px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted);box-shadow:0 2px 12px rgba(0,0,0,.04)}
.search input{flex:1;border:0;outline:none;background:none;font-size:16px;color:var(--ink)}
.bigfavs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:22px 12px;margin-top:36px;width:100%;max-width:640px}
.bigfavs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-radius:14px;min-width:0}
.bigfavs button:hover{background:var(--hover)}
.bigfavs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigfavs .fav{border-radius:17px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.bigfavs .add .fav{background:none;border:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);color:var(--muted);box-shadow:none}
.tip{font-size:13px;color:var(--muted);margin:16px 0 0}
.foot{margin-top:auto;padding-top:36px;display:flex;flex-direction:column;align-items:center;gap:10px}
.link{border:0;background:none;color:var(--accent);display:flex;align-items:center;gap:6px;padding:4px}
.privcard{max-width:560px;width:100%;text-align:left;border-radius:18px;padding:14px 16px;margin-bottom:22px;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);line-height:1.5}
.privcard b{display:flex;align-items:center;gap:8px;font-size:15.5px;margin-bottom:4px}
.paused{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
.paused h2{font-size:26px;font-weight:600;margin:6px 0 0}
.paused p{color:var(--muted);max-width:360px;line-height:1.5;margin:0}
.paused .fav{filter:grayscale(1);opacity:.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="m-pinned screen">
  <aside id="sb" aria-label="Tabs and spaces"></aside>
  <nav id="rail" aria-label="Tabs"></nav>
  <div id="edge" aria-hidden="true"></div>
  <main id="content"></main>
  <div id="scrim"></div>
  <section id="pop" class="pop" role="dialog"></section>
  <section id="cmd" role="dialog" aria-label="Search or type a web address"></section>
  <section id="modal" class="modal" role="dialog" aria-modal="true"></section>
  <section id="glance" role="dialog" aria-label="Glance"></section>
  <div id="stack" aria-live="polite"></div>
</div>
<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    case 'gl-open': { L.invoke('lull:glance-url').then((u) => { const url = u && /^https?:/.test(u) ? u : glanceUrl; closeGlance(); newTab(url); }); break; }
    case 'gl-copy': send('copy', glanceUrl); toast({ icon: 'copy', title: 'Link copied', ms: 2500 }); break;
    case 'gl-close': closeGlance(); break;
    case 'fav-new': favEdit = -1; openModal('fav'); setTimeout(() => { const n = $('#favUrl'); if (n) n.focus(); }, 60); break;
    case 'fav-move': { const j = favEdit + (+v); if (j < 0 || j >= S.favs.length) break; const f = S.favs.splice(favEdit, 1)[0]; S.favs.splice(j, 0, f); favEdit = j; save(); renderModal(); renderLight(); if (screenShown()) renderContent(); break; }
    case 'fav-del': if (favEdit >= 0) { S.favs.splice(favEdit, 1); save(); closeModal(); renderAll(); } break;
    case 'tm-dup': { const x = S.tabs.find((y) => y.id === v); closePop(); if (x && x.url !== START) newTab(x.url); break; }
    case 'tm-fav': { const x = S.tabs.find((y) => y.id === v); closePop(); if (x && isFav(x.url) < 0) { S.favs.push({ url: x.url, name: shortName(x) }); save(); renderLight(); toast({ icon: 'star', title: 'Added to favourites', ms: 3000 }); } break; }
    case 'tm-move': { const [id, ws] = v.split(':'); const x = S.tabs.find((y) => y.id === id); closePop(); if (!x) break; const wasActive = S.active[x.ws] === id; const from = x.ws; x.ws = ws; if (wasActive) { const rest = wsTabs(from); S.active[from] = rest[0] ? rest[0].id : mkTab(START, from).id; } save(); showCurrent(); toast({ icon: 'open', title: 'Moved to ' + (WS.find((w) => w.id === ws) || {}).name, ms: 3000 }); break; }
    case 'session': S.session = Date.now() + (+v) * 60000; save(); renderModal(); checkFocusNow(); break;
    case 'session-end': S.session = 0; save(); renderModal(); unpause(t); break;
    case 'lim+': case 'lim-': { const l = S.limits.find((x) => x.host === v); if (l) { l.min = Math.max(5, l.min + (k === 'lim+' ? 5 : -5)); save(); renderModal(); checkFocusNow(); } break; }
    case 'lim-del': S.limits = S.limits.filter((x) => x.host !== v); save(); renderModal(); unpause(t); break;
    case 'pz-back': { e.paused = null; if (e.canBack) { send('show', t.id, ''); send('nav', t.id, 'back'); } else { t.url = START; t.title = 'New tab'; send('close', t.id); } save(); showCurrent(); break; }
    case 'pz-more': { const l = limitFor(hostOf(e.paused || '')); if (l) { usage()[l.host] = Math.max(0, l.min * 60 - 300); save(); } unpause(t); break; }
  }
}
function unpause(t) { const e = E(t.id); if (!e.paused) return; const u = e.paused; e.paused = null; t.url = u; send('open', t.id, u); save(); showCurrent(); }
function checkFocusNow() { const t = cur(), e = E(t.id); if (t.url !== START && !e.paused && focusBlocked(t.url)) { e.paused = t.url; send('nav', t.id, 'stop'); showCurrent(); } else if (screenShown()) renderContent(); }

/* ---------- input ---------- */
document.addEventListener('click', (ev) => {
  const f = ev.target.closest('[data-fav]');
  if (f) { closePop(); setPeek(false); openFav(+f.dataset.fav, ev.metaKey || ev.ctrlKey); return; }
  const b = ev.target.closest('[data-act]');
  if (b && !b.disabled) act(b.dataset.act, b, ev);
});
document.addEventListener('auxclick', (ev) => {
  if (ev.button !== 1) return;
  const row = ev.target.closest('.trow');
  if (row) { ev.preventDefault(); closeTab(row.dataset.tab); }
  const f = ev.target.closest('[data-fav]');
  if (f) { ev.preventDefault(); openFav(+f.dataset.fav, true); }
});
document.addEventListener('contextmenu', (ev) => {
  ev.preventDefault();
  const f = ev.target.closest('[data-fav]');
  if (f && !PRIV) { favEdit = +f.dataset.fav; openModal('fav'); return; }
  const row = ev.target.closest('.trow');
  if (row) { popKind = 'tabmenu:' + row.dataset.tab; syncLayout(); requestAnimationFrame(() => { renderPop(); const p = $('#pop'); p.classList.add('on'); p.style.width = '230px'; p.style.left = Math.min(ev.clientX, innerWidth - 240) + 'px'; p.style.top = Math.min(ev.clientY, innerHeight - 260) + 'px'; p.style.bottom = 'auto'; }); }
});
$('#scrim').addEventListener('click', () => { if (glanceOpen) closeGlance(); else if (modalKind) closeModal(); else if (cmdOpen) closeCmd(); else closePop(); $('#pop').style.width = ''; });
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') {
    if (cmdOpen) closeCmd(); else if (glanceOpen) closeGlance(); else if (modalKind) closeModal(); else if (popKind) closePop(); else if (findOpen) closeFind(); else if (peek) setPeek(false);
  }
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const f = ev.target.dataset.form;
  if (f === 'cmd') runSugg(cmdItems.length ? cmdSel : -1);
  if (f === 'start') { const v = $('#startIn').value.trim(); if (v) navigate(v); }
  if (f === 'find') findGo(true, true);
  if (f === 'lim') {
    const h = bare(hostOf(toUrl($('#limHost').value.trim())) || '');
    const m = Math.max(1, Math.min(600, parseInt($('#limMin').value, 10) || 20));
    if (!h || !h.includes('.')) { toast({ icon: 'focus', title: 'Type a site address, like youtube.com' }); return; }
    const l = S.limits.find((x) => x.host === h); if (l) l.min = m; else S.limits.push({ host: h, min: m });
    save(); renderModal(); checkFocusNow();
  }
  if (f === 'fav') {
    const name = $('#favName').value.trim(), raw = $('#favUrl').value.trim(), url = toUrl(raw);
    if (!raw || (searchQuery(url) != null && !/^https?:/i.test(raw))) { toast({ icon: 'star', title: 'Type an address, like wikipedia.org' }); return; }
    const nm = name || bare(hostOf(url)).split('.').slice(-2)[0] || raw;
    const item = { url, name: nm.charAt(0).toUpperCase() + nm.slice(1) };
    if (favEdit >= 0) S.favs[favEdit] = item; else S.favs.push(item);
    save(); closeModal(); renderAll();
  }
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'findIn') { findText = ev.target.value; findGo(true, false); }
});

/* drag tabs: reorder, or drop on the favourites to add */
let dragId = null;
document.addEventListener('dragstart', (ev) => { const r = ev.target.closest && ev.target.closest('.trow'); if (!r) return; dragId = r.dataset.tab; ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', dragId); });
document.addEventListener('dragover', (ev) => {
  if (!dragId) return;
  const r = ev.target.closest('.trow'), fv = ev.target.closest('#sbfavs');
  document.querySelectorAll('.drag-over').forEach((x) => x.classList.remove('drag-over'));
  const fz = $('#sbfavs'); if (fz) fz.classList.toggle('drop', !!fv);
  if (r || fv) { ev.preventDefault(); if (r) r.classList.add('drag-over'); }
});
document.addEventListener('drop', (ev) => {
  if (!dragId) return;
  ev.preventDefault();
  const r = ev.target.closest('.trow'), fv = ev.target.closest('#sbfavs');
  const t = S.tabs.find((x) => x.id === dragId);
  if (fv && t && t.url !== START && isFav(t.url) < 0) { S.favs.push({ url: t.url, name: shortName(t) }); toast({ icon: 'star', title: 'Added to favourites', ms: 3000 }); }
  else if (r && t && r.dataset.tab !== dragId) { const from = S.tabs.indexOf(t); S.tabs.splice(from, 1); const to = S.tabs.findIndex((x) => x.id === r.dataset.tab); S.tabs.splice(to, 0, t); }
  dragId = null; save(); renderLight();
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.drag-over').forEach((x) => x.classList.remove('drag-over')); const fz = $('#sbfavs'); if (fz) fz.classList.remove('drop'); });

/* resize the pinned sidebar */
let rz = null;
document.addEventListener('pointerdown', (ev) => { if (ev.target.classList && ev.target.classList.contains('resize')) { rz = { x: ev.clientX, w: width() }; ev.target.setPointerCapture(ev.pointerId); document.body.style.cursor = 'col-resize'; } });
document.addEventListener('pointermove', (ev) => { if (!rz) return; S.sidebar.width = Math.max(220, Math.min(440, rz.w + ev.clientX - rz.x)); document.documentElement.style.setProperty('--sbw', S.sidebar.width + 'px'); document.documentElement.style.setProperty('--dock', S.sidebar.width + 'px'); syncLayout(); });
document.addEventListener('pointerup', () => { if (!rz) return; rz = null; document.body.style.cursor = ''; save(); });

/* ---------- ticking: clock, focus sessions, daily limits ---------- */
let hadSession = sessionLeft() > 0;
setInterval(() => {
  const now = new Date();
  document.querySelectorAll('[data-clock]').forEach((el) => { el.textContent = clock(now); });
  const left = sessionLeft();
  document.querySelectorAll('[data-left]').forEach((el) => { el.textContent = fmt(left); });
  if (hadSession && !left) { S.session = 0; save(); toast({ icon: 'focus', title: 'Focus session finished' }); const t = cur(); if (E(t.id).paused && !focusBlocked(E(t.id).paused)) unpause(t); else if (screenShown()) renderContent(); renderModal(); }
  hadSession = left > 0;
  const t = cur(), e = E(t.id);
  if (visible && t.url !== START && !e.paused) {
    const l = limitFor(hostOf(t.url));
    if (l) {
      const u = usage();
      u[l.host] = (u[l.host] || 0) + 1;
      const rem = l.min * 60 - u[l.host];
      if (rem === 60) toast({ icon: 'focus', title: '1 minute left on ' + l.host + ' today' });
      if (rem <= 0) { e.paused = t.url; send('nav', t.id, 'stop'); showCurrent(); toast({ icon: 'focus', title: 'Daily limit reached for ' + l.host }); }
      if (u[l.host] % 15 === 0) save();
      if (modalKind === 'focus' && u[l.host] % 5 === 0) renderModal();
    }
  }
}, 1000);

/* ---------- start ---------- */
(async () => {
  try { info = (await L.invoke('lull:info')) || {}; } catch (e) { info = {}; }
  let saved = null;
  try { saved = JSON.parse((await L.invoke('lull:state')) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.v === 1) {
    S = Object.assign(defaults(), saved);
    S.block = Object.assign(defaults().block, saved.block || {});
    S.sidebar = Object.assign(defaults().sidebar, saved.sidebar || {});
  }
  if (PRIV) S = Object.assign(S, { activeWs: 'private', tabs: [{ id: 'p1', ws: 'private', url: START, title: 'New tab' }], active: { private: 'p1' }, hist: [], closed: [], seenHelp: true, week: { k: weekKey(), n: 0 } });
  if (S.week.k !== weekKey()) S.week = { k: weekKey(), n: 0 };
  applyTheme();
  pushSettings();
  showCurrent();
  if (!S.seenHelp) openModal('help');
  send('ready');
})();
})();
</script>
</body>
</html>
